<script>
(function () {
  const S = "#s03 ";
  const V = 0.75;   // voice starts
  const D = 3.968; // voice duration
  const DUR = 8.018;
  const root = document.getElementById("s03");
  const el = (q) => root.querySelector(q);
  const tl = gsap.timeline({ paused: true });
  // blur crossfade in over the previous scene
  tl.fromTo(S + "#s03-fade", { opacity: 0, filter: "blur(18px)", scale: 1.035 },
    { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "sine.inOut" }, 0);

  tl.fromTo(S + "#s03-oa", { x: 0, y: 0 }, { x: 120, y: 60, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(S + "#s03-ob", { x: 0, y: 0 }, { x: -110, y: -50, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(S + "#s03-oc", { scale: 0.9 }, { scale: 1.15, duration: DUR, ease: "sine.inOut" }, 0);

      tl.fromTo(S+"#s03-mark",{scale:.6,opacity:0},{scale:1,opacity:1,duration:1.0,ease:"expo.out"},V-.5);

      tl.fromTo(S+"#s03-h",{opacity:0,y:40,scale:1.06},{opacity:1,y:0,scale:1,duration:1.0,ease:"power3.out"},V+.1);
      tl.fromTo(S+"#s03-a",{opacity:0,y:20},{opacity:1,y:0,duration:.5},V+1.6);
      tl.fromTo(S+"#s03-b",{opacity:0,y:20},{opacity:1,y:0,duration:.5},V+2.7);
    
  window.__timelines["s03"] = tl;
})();
