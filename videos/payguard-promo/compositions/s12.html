<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s12-template">
<link rel="stylesheet" href="assets/pg.css" />
<style>
  #s12 { position: absolute; inset: 0; }
  #s12-fade { position: absolute; inset: 0; }

      #s12 .side{position:absolute;left:1430px;top:150px;width:420px;display:flex;flex-direction:column;gap:22px}
      #s12 .side .chip{font-size:24px;padding:16px 24px}
      #s12 .fool{position:absolute;left:1430px;top:720px;width:430px}
      #s12 .fool .n{font-weight:900;font-size:120px;letter-spacing:-.05em;color:#d92d20;line-height:1.2;margin-bottom:10px}
    
</style>
<div id="s12" data-composition-id="s12" data-width="1920" data-height="1080" data-duration="9.05">
  <div class="pg-scene" id="s12-fade">
    <div class="pg-bg"><span class="pg-orb a" id="s12-oa"></span><span class="pg-orb b" id="s12-ob"></span><span class="pg-orb c" id="s12-oc"></span><div class="pg-grain"></div></div>
<div class="device" id="s12-dev" style="left:90px;top:160px;width:1280px;height:764px;"><div class="device-bar"><i></i><i></i><i></i></div><div style="position:absolute;left:0;right:0;top:44px;bottom:0;overflow:hidden"><div class="device-inner" id="s12-zoom"><video id="s12-v0" class="clip" src="assets/footage/attack-lab.mp4" muted playsinline data-start="0.00" data-duration="99.00" data-media-start="11.00" data-track-index="2" data-playback-rate="2.8"></video></div></div></div>
      <div style="position:absolute;left:90px;top:60px" class="eyebrow" id="s12-e">Attack Lab · red team</div>
      <div class="side"><span class="chip red" id="s12-t0">Prompt injection</span><span class="chip red" id="s12-t1">Invisible characters</span><span class="chip red" id="s12-t2">Look-alike accounts</span><span class="chip red" id="s12-t3">Sinhala instructions</span></div>
      <div class="fool" id="s12-f"><div class="n">10 / 10</div><div class="body" style="font-size:30px">times the agent was fooled</div></div>
    
  </div>
</div>
<script>
(function () {
  const S = "#s12 ";
  const V = 0.75;   // voice starts
  const D = 5.205; // voice duration
  const DUR = 9.055;
  const root = document.getElementById("s12");
  const el = (q) => root.querySelector(q);
  const tl = gsap.timeline({ paused: true });
  // blur crossfade in over the previous scene
  tl.fromTo(S + "#s12-fade", { opacity: 0, filter: "blur(18px)", scale: 1.035 },
    { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "sine.inOut" }, 0);
  // ambient orb drift
  tl.fromTo(S + "#s12-oa", { x: 0, y: 0 }, { x: 120, y: 60, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(S + "#s12-ob", { x: 0, y: 0 }, { x: -110, y: -50, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(S + "#s12-oc", { scale: 0.9 }, { scale: 1.15, duration: DUR, ease: "sine.inOut" }, 0);

      tl.fromTo(S+"#s12-dev",{opacity:0,x:-60},{opacity:1,x:0,duration:.8,ease:"power3.out"},0.15);
      tl.fromTo(S+"#s12-e",{opacity:0},{opacity:1,duration:.4},V);
      tl.fromTo(S+"#s12-zoom",{scale:1.2,x:80,y:120},{scale:1.2,x:80,y:-40,duration:5.5,ease:"power1.inOut"},V+.2);
      tl.to(S+"#s12-zoom",{scale:1.45,x:220,y:250,duration:1.2,ease:"power2.inOut"},V+6.0);
      tl.fromTo([S+"#s12-t0",S+"#s12-t1",S+"#s12-t2",S+"#s12-t3"],{opacity:0,x:60},{opacity:1,x:0,duration:.45,stagger:.55,ease:"back.out(1.6)"},V+.6);
      tl.fromTo(S+"#s12-f",{opacity:0,scale:1.3},{opacity:1,scale:1,duration:.5,ease:"power4.out"},V+3.6);
    
  window.__timelines["s12"] = tl;
})();
</script>
</template>
</body>
</html>
