<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s17-template">
<link rel="stylesheet" href="assets/pg.css" />
<style>
  #s17 { position: absolute; inset: 0; }
  #s17-fade { position: absolute; inset: 0; }

      #s17 .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
      #s17 .mark{width:200px;height:200px;display:grid;place-items:center;border-radius:60px}
      #s17 .mark svg{width:120px;height:120px}
      #s17 .tick{stroke-dasharray:1;stroke-dashoffset:0}
      #s17 h1{font-weight:900;font-size:150px;letter-spacing:-.055em;margin:44px 0 30px;line-height:1}
      #s17 .ln{font-weight:800;font-size:54px;letter-spacing:-.02em;margin:6px 0}
    
</style>
<div id="s17" data-composition-id="s17" data-width="1920" data-height="1080" data-duration="7.65">
  <div class="pg-scene" id="s17-fade">
    <div class="pg-bg"><span class="pg-orb a" id="s17-oa"></span><span class="pg-orb b" id="s17-ob"></span><span class="pg-orb c" id="s17-oc"></span><div class="pg-grain"></div></div>

      <div class="wrap" id="s17-wrap">
        <div class="mark neu" id="s17-mark"><svg viewBox="0 0 64 64" class="s17-shield"><defs><linearGradient id="s17g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0891b2"/></linearGradient></defs><path d="M32 4 8 13v17c0 15 10.3 26.6 24 30 13.7-3.4 24-15 24-30V13L32 4z" fill="url(#s17g)"/><path class="tick" pathLength="1" d="m21 32 8 8 15-16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h1 id="s17-h">PayGuard</h1>
        <div class="ln" id="s17-l1" style="color:#46526a">The AI proposes.</div>
        <div class="ln" id="s17-l2" style="color:#4f46e5">The gateway decides.</div>
        <div class="ln" id="s17-l3">You stay in control.</div>
      </div>
    
  </div>
</div>
<script>
(function () {
  const S = "#s17 ";
  const V = 0.75;   // voice starts
  const D = 3.499; // voice duration
  const DUR = 7.649;
  const root = document.getElementById("s17");
  const el = (q) => root.querySelector(q);
  const tl = gsap.timeline({ paused: true });
  // blur crossfade in over the previous scene
  tl.fromTo(S + "#s17-fade", { opacity: 0, filter: "blur(18px)", scale: 1.035 },
    { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.7, ease: "sine.inOut" }, 0);
  // ambient orb drift
  tl.fromTo(S + "#s17-oa", { x: 0, y: 0 }, { x: 120, y: 60, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(S + "#s17-ob", { x: 0, y: 0 }, { x: -110, y: -50, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo(S + "#s17-oc", { scale: 0.9 }, { scale: 1.15, duration: DUR, ease: "sine.inOut" }, 0);

      tl.fromTo(S+"#s17-mark",{scale:.7,opacity:0},{scale:1,opacity:1,duration:.9,ease:"expo.out"},V-.4);
      tl.fromTo(S+"#s17-h",{opacity:0,y:30},{opacity:1,y:0,duration:.8,ease:"power3.out"},V+.1);
      tl.fromTo(S+"#s17-l1",{opacity:0,y:20},{opacity:1,y:0,duration:.5},V+.9);
      tl.fromTo(S+"#s17-l2",{opacity:0,y:20},{opacity:1,y:0,duration:.5},V+2.0);
      tl.fromTo(S+"#s17-l3",{opacity:0,y:20},{opacity:1,y:0,duration:.5},V+3.3);
      tl.to(S+"#s17-wrap",{opacity:0,filter:"blur(10px)",duration:1.0,ease:"sine.inOut"},DUR-1.1);
    
  window.__timelines["s17"] = tl;
})();
</script>
</template>
</body>
</html>
